name: Deploy MCP Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/spec-trace-mcp/content/**"
      - "apps/spec-trace-mcp/scripts/**"
      - "apps/spec-trace-mcp/src/**"
      - "apps/spec-trace-mcp/package.json"
      - "apps/spec-trace-mcp/package-lock.json"
      - "apps/spec-trace-mcp/mcp.config.json"
      - "apps/spec-trace-mcp/wrangler.toml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefix apps/spec-trace-mcp
      - run: npm --prefix apps/spec-trace-mcp run build:mcp
      - run: npx wrangler deploy --config apps/spec-trace-mcp/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
